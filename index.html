<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score: <span id="high-score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Level: <span id="level">1</span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00:00</span></h3>
                </div>
                <div class="info theme-control">
                    <select id="theme-switcher">
                        <option value="cyberpunk">🌐 Neon Cyberpunk</option>
                        <option value="retro">👾 Classic Retro</option>
                        <option value="light">☀️ Light Mode</option>
                    </select>
                </div>
            </div>

            <div class="board-wrapper">
                <div class="pause-overlay" id="pause-overlay">
                    <span>⏸ PAUSED</span>
                    <small>Press Space to resume</small>
                </div>
                <div class="board"></div>
            </div>
        </section>

        <div class="modal">
            <div class="start-game">
                <h3>Snake Game</h3>
                <p>Use arrow keys to move<br>Space to pause · Every 50pts = Level Up</p>
                <button class="btn btn-start">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <p id="final-score-text">Score: 0</p>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
